<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient Line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glow Effects -->
    <filter id="blurFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatY1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatY2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    .pulse-node-1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: 180px 90px; }
    .pulse-node-2 { animation: pulseGlow 7s ease-in-out infinite 1s; transform-origin: 1020px 250px; }
    .animated-stream { stroke-dasharray: 8, 12; animation: dashMove 3s linear infinite; }
    .floating-card-left { animation: floatY1 4s ease-in-out infinite; }
    .floating-card-right { animation: floatY2 5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200" />
    <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340 M600 0 V340 M700 0 V340 M800 0 V340 M900 0 V340 M1000 0 V340 M1100 0 V340" />
  </g>

  <!-- Dynamic Animated Glow Orbs in Background -->
  <circle cx="180" cy="90" r="140" fill="url(#glow1)" class="pulse-node-1" filter="url(#blurFilter)" />
  <circle cx="1020" cy="250" r="150" fill="url(#glow2)" class="pulse-node-2" filter="url(#blurFilter)" />

  <!-- Dynamic Network Data Flow Lines (Behind text layer) -->
  <g opacity="0.3" stroke="#8b5cf6" stroke-width="2">
    <line x1="120" y1="280" x2="320" y2="290" class="animated-stream" />
    <line x1="880" y1="50" x2="1080" y2="80" class="animated-stream" />
  </g>

  <!-- Outer Floating Badges (Kept at extreme margins so center foreground is 100% clear) -->
  <g class="floating-card-left" transform="translate(50, 45)">
    <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <circle cx="18" cy="18" r="5" fill="#38bdf8" />
    <text x="32" y="23" class="badge-label">AWS RAM ☁️</text>
  </g>

  <g class="floating-card-right" transform="translate(1005, 45)">
    <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
    <circle cx="18" cy="18" r="5" fill="#10b981" />
    <text x="32" y="23" class="badge-label">Crossplane ⚡</text>
  </g>

  <g class="floating-card-left" transform="translate(990, 255)">
    <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" opacity="0.95" />
    <circle cx="18" cy="18" r="5" fill="#f43f5e" />
    <text x="32" y="23" class="badge-label">Azure Policy 🛡️</text>
  </g>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#lineGrad)" />

  <!-- Foreground Title and Subtitle (Unobstructed & High Contrast) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Title -->
    <text y="0" class="title-text">Awesome Multi-Account Resource Sharing 🌐</text>
    
    <!-- Subtitle -->
    <text y="42" class="subtitle-text">Curated Multi-Cloud Access, Infrastructure Governance &amp; Cross-Account Orchestration</text>
  </g>

  <!-- Bottom Interactive Ecosystem Pill -->
  <g transform="translate(600, 265)" text-anchor="middle">
    <rect x="-330" y="-18" width="660" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <text y="5" class="badge-label" fill="#cbd5e1">
      ☁️ AWS RAM  |  🛡️ Azure Policy  |  ⚡ GCP IAM  |  📦 OpenTofu  |  🔒 OPA Policy
    </text>
  </g>
</svg>
